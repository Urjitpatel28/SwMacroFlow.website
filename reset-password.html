<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Reset your password — SwMacroFlow</title>
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/auth.css">
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="SwMacroFlow logo">
      SwMacroFlow
    </a>
    <nav class="nav-links">
      <a href="index.html#features">Features</a>
      <a href="index.html#faq">FAQ</a>
      <a href="login.html">Sign in</a>
    </nav>
  </div>
</header>

<!--
  Both halves of the reset live on this one page.

  Supabase sends the recovery link back here and signs the browser in with a short-lived recovery
  session, so the page has to be two things depending on how it was reached: a "send me a link" form
  when arrived at cold, and a "choose a new password" form when arrived at from the email. Splitting
  them would mean a second allow-listed redirect URL for no gain.
-->
<main class="auth-main">
  <div class="auth-card">
    <section id="request">
      <h1>Reset your password</h1>
      <p>We will email you a link to choose a new one.</p>

      <div class="auth-panel">
        <form id="requestForm" novalidate>
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" placeholder="you@example.com" required>
          <button id="requestSubmit" class="btn btn-primary btn-block" type="submit">Email me a link</button>
        </form>
        <p id="message" class="message"></p>
      </div>
    </section>

    <section id="choose" hidden>
      <h1>Choose a new password</h1>
      <p>At least six characters.</p>

      <div class="auth-panel">
        <form id="chooseForm" novalidate>
          <label for="password">New password</label>
          <input id="password" type="password" autocomplete="new-password" minlength="6" required>
          <button id="chooseSubmit" class="btn btn-primary btn-block" type="submit">Save password</button>
        </form>
      </div>
    </section>

    <p class="auth-links"><a href="login.html">Back to sign in</a></p>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-brand">
      <img src="assets/logo.png" alt="SwMacroFlow logo">
      SwMacroFlow
    </div>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="mailto:urjitpatel28@gmail.com">Contact / Support</a>
      <a href="terms.html">Terms</a>
      <a href="privacy.html">Privacy</a>
    </div>
    <div class="footer-copy">© 2026 SwMacroFlow. All rights reserved.</div>
  </div>
</footer>

<script type="module">
import { supabase, say, busy, readable, SITE_URL } from "./assets/auth.js";

const request = document.getElementById("request");
const choose = document.getElementById("choose");
const requestSubmit = document.getElementById("requestSubmit");
const chooseSubmit = document.getElementById("chooseSubmit");

// Arriving from the email fires PASSWORD_RECOVERY once supabase-js has consumed the link.
supabase.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    request.hidden = true;
    choose.hidden = false;
    say("");
  }
});

document.getElementById("requestForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  if (!email) {
    say("Enter your email address.", "error");
    return;
  }

  busy(true, requestSubmit);
  say("Sending…");

  const { error } = await supabase.auth.resetPasswordForEmail(email, {
    redirectTo: `${SITE_URL}/reset-password.html`,
  });

  busy(false, requestSubmit);

  if (error) {
    say(readable(error), "error");
    return;
  }

  // Deliberately the same answer whether or not that address has an account. Anything else turns
  // this form into a way to find out who is registered.
  say("If there is an account with that address, a reset link is on its way.", "ok");
});

document.getElementById("chooseForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const password = document.getElementById("password").value;
  if (password.length < 6) {
    say("Choose a password of at least six characters.", "error");
    return;
  }

  busy(true, chooseSubmit);
  say("Saving…");

  const { error } = await supabase.auth.updateUser({ password });

  busy(false, chooseSubmit);

  if (error) {
    say(readable(error), "error");
    return;
  }

  say("Password saved. Sending you to sign in…", "ok");
  setTimeout(() => location.replace("login.html"), 1200);
});
</script>

</body>
</html>
