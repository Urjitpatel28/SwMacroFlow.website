<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sign in — SwMacroFlow</title>
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/auth.css">
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="SwMacroFlow logo">
      SwMacroFlow
    </a>
    <nav class="nav-links">
      <a href="index.html#features">Features</a>
      <a href="index.html#faq">FAQ</a>
      <a href="account.html" data-account="signed-in" hidden>Account</a>
    </nav>
    <a class="nav-cta" href="signup.html" data-account="signed-out">Create free account</a>
  </div>
</header>

<main class="auth-main">
  <div class="auth-card">
    <h1>Sign in</h1>
    <p>Free for everyone until 1 August 2027. Your licence works on one computer at a time.</p>

    <div class="auth-panel">
      <form id="form" novalidate>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>

        <button id="submit" class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>

      <p id="message" class="message"></p>

      <div class="divider">or</div>
      <button id="google" class="btn btn-secondary btn-block" type="button">Continue with Google</button>
      <button id="microsoft" class="btn btn-secondary btn-block" type="button">Continue with Microsoft</button>
    </div>

    <p class="auth-links">
      <a href="signup.html">Create an account</a> ·
      <a href="reset-password.html">Forgot password</a>
    </p>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-brand">
      <img src="assets/logo.png" alt="SwMacroFlow logo">
      SwMacroFlow
    </div>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="mailto:urjitpatel28@gmail.com">Contact / Support</a>
      <a href="terms.html">Terms</a>
      <a href="privacy.html">Privacy</a>
    </div>
    <div class="footer-copy">© 2026 SwMacroFlow. All rights reserved.</div>
  </div>
</footer>

<script type="module" src="assets/session.js"></script>
<script type="module">
import { supabase, say, busy, readable, signInWithProvider, SITE_URL } from "./assets/auth.js";

const form = document.getElementById("form");
const submit = document.getElementById("submit");
const google = document.getElementById("google");
const microsoft = document.getElementById("microsoft");

// Where to land afterwards. `next` arrives in a URL anyone can hand out, so it is matched against a
// pattern rather than trusted - an open redirect on a sign-in page is how a convincing phishing
// flow starts.
const requested = new URLSearchParams(location.search).get("next") || "account.html";
const next = /^[a-z0-9-]+\.html$/.test(requested) ? requested : "account.html";

if (new URLSearchParams(location.search).get("confirmed") === "1") {
  say("Email confirmed. Sign in to carry on.", "ok");
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    say("Enter your email address and password.", "error");
    return;
  }

  busy(true, submit, google, microsoft);
  say("Signing in…");

  const { error } = await supabase.auth.signInWithPassword({ email, password });

  busy(false, submit, google, microsoft);

  if (error) {
    say(readable(error), "error");
    return;
  }

  location.replace(next);
});

google.addEventListener("click", () => signInWithProvider("google", `${SITE_URL}/${next}`));
microsoft.addEventListener("click", () => signInWithProvider("azure", `${SITE_URL}/${next}`));
</script>

</body>
</html>
