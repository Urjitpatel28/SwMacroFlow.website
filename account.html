<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Your account — SwMacroFlow</title>
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/auth.css">
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="SwMacroFlow logo">
      SwMacroFlow
    </a>
    <nav class="nav-links">
      <a href="index.html#features">Features</a>
      <a href="index.html#faq">FAQ</a>
      <a href="mailto:urjitpatel28@gmail.com">Support</a>
    </nav>
  </div>
</header>

<main class="auth-main">
  <div class="auth-card wide">
    <h1>Your account</h1>
    <p>Your SwMacroFlow licence, and the computer it is currently on.</p>

    <div class="auth-panel">
      <dl class="account-list">
        <dt>Signed in as</dt>
        <dd id="email">…</dd>

        <dt>Plan</dt>
        <dd id="plan">…</dd>

        <dt>Active computer</dt>
        <dd>
          <span id="device">…</span>
          <small id="transfers"></small>
        </dd>
      </dl>

      <!--
        Releasing from here is the main reason this page exists.

        Uninstalling SwMacroFlow does not free a licence - the uninstaller hands off to the Windows
        installer bundle and never gets a chance to tell the server anything - so a computer that
        died, was sold, or was reimaged can only be released from somewhere else. Without this
        button that is a support ticket every time.
      -->
      <div class="account-actions">
        <button id="release" class="btn btn-primary" type="button">Release this computer</button>
        <button id="signout" class="btn btn-secondary" type="button">Sign out</button>
      </div>

      <p id="message" class="message"></p>
    </div>

    <p class="auth-links">
      Need a licence moved again? Email <a id="support" href="#">support</a>.
    </p>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-brand">
      <img src="assets/logo.png" alt="SwMacroFlow logo">
      SwMacroFlow
    </div>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="mailto:urjitpatel28@gmail.com">Contact / Support</a>
      <a href="terms.html">Terms</a>
      <a href="privacy.html">Privacy</a>
    </div>
    <div class="footer-copy">© 2026 SwMacroFlow. All rights reserved.</div>
  </div>
</footer>

<script type="module">
import {
  supabase, say, busy, readable, requireSession, callFunction,
  readEntitlement, formatDate, SUPPORT_EMAIL,
} from "./assets/auth.js";

const release = document.getElementById("release");
const signout = document.getElementById("signout");
const support = document.getElementById("support");

support.href = `mailto:${SUPPORT_EMAIL}`;
support.textContent = SUPPORT_EMAIL;

// Redirects to login.html when there is no session, so this page never renders half-empty.
const session = await requireSession();

if (session) {
  document.getElementById("email").textContent = session.user.email ?? "—";
  await load();
}

async function load() {
  const { ok, status, payload } = await callFunction("license-status", session);

  if (!ok) {
    // 423 and 403 are states, not errors - a blocked or withdrawn licence is exactly what someone
    // opens this page to find out about, so they get a real answer rather than "something failed".
    if (status === 423) {
      document.getElementById("plan").textContent = "Blocked — all device changes used";
      say(payload?.message ?? `Email ${SUPPORT_EMAIL} and we will move it for you.`, "warn");
    } else if (status === 403) {
      document.getElementById("plan").textContent = "No longer active";
      say("This licence has been withdrawn.", "error");
    } else {
      say("Could not load your licence. Try again in a moment.", "error");
    }
    release.disabled = true;
    return;
  }

  const entitlement = readEntitlement(payload.token);
  if (!entitlement) {
    say("Could not read your licence details.", "error");
    return;
  }

  document.getElementById("plan").textContent = entitlement.plan === "free"
    ? `Free for everyone until ${formatDate(entitlement.validUntil)}`
    : `Annual subscription, renews ${formatDate(entitlement.validUntil)}`;

  const active = entitlement.deviceName;
  document.getElementById("device").textContent = active || "None — not activated on any computer";
  release.disabled = !active;

  const used = entitlement.transfersUsed ?? 0;
  const limit = entitlement.transferLimit ?? 0;
  const note = document.getElementById("transfers");

  if (limit > 0) {
    const left = Math.max(0, limit - used);
    note.textContent =
      `${used} of ${limit} device changes used` +
      (left === 0
        ? ` — email ${SUPPORT_EMAIL} to move this licence again.`
        : left === 1
          ? " — one left. After that, only support can move it."
          : "");
    note.classList.toggle("low", left <= 1);
  }
}

release.addEventListener("click", async () => {
  if (!confirm(
    "Release the computer currently using this licence?\n\n" +
    "You can activate another computer afterwards without using up a device change.")) {
    return;
  }

  busy(true, release, signout);
  say("Releasing…");

  const { ok } = await callFunction("license-deactivate", session);

  busy(false, release, signout);

  if (!ok) {
    say("Could not release it just now. Try again in a moment.", "error");
    return;
  }

  say("Released. You can now activate SwMacroFlow on another computer.", "ok");
  await load();
});

signout.addEventListener("click", async () => {
  const { error } = await supabase.auth.signOut();
  if (error) {
    say(readable(error), "error");
    return;
  }
  location.replace("login.html");
});
</script>

</body>
</html>
