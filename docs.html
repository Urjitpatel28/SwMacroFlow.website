<script>
  // The guides are a copy of SwMacroFlow.Ui/Resources/Help/*.md from the application repository,
  // which is private, so they are served from this repo rather than fetched from GitHub.
  const DOCS_PATH = "docs";

  const nav = document.getElementById("docNav");
  const search = document.getElementById("docSearch");
  const titleEl = document.getElementById("docTitle");
  const bodyEl = document.getElementById("docBody");

  const state = { groups: [], docs: new Map(), current: "" };

  function titleFromSlug(slug) {
    return slug.replace(/^\d+-/, "").replace(/-/g, " ");
  }

  async function fetchText(url) {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`Request failed with ${response.status}`);
    return response.text();
  }

  function renderNav() {
    const query = search.value.trim().toLowerCase();
    const parts = [];

    state.groups.forEach(group => {
      const matches = group.docs.filter(slug => {
        const doc = state.docs.get(slug);
        return doc && (!query || doc.search.includes(query));
      });
      if (!matches.length) return;

      parts.push(`<p class="docs-nav-group">${SwMarkdown.escapeHtml(group.title)}</p><ul>`);
      matches.forEach(slug => {
        const doc = state.docs.get(slug);
        const active = slug === state.current ? ' class="is-active" aria-current="page"' : "";
        parts.push(`<li><a href="#${SwMarkdown.escapeHtml(slug)}"${active}>${SwMarkdown.escapeHtml(doc.title)}</a></li>`);
      });
      parts.push("</ul>");
    });

    nav.innerHTML = parts.length
      ? parts.join("")
      : `<p class="docs-nav-status">No guide matched your search.</p>`;
  }

  function showDoc(slug) {
    const doc = state.docs.get(slug);
    if (!doc) return;

    state.current = slug;
    titleEl.textContent = doc.title;
    bodyEl.innerHTML = SwMarkdown.toHtml(doc.markdown, { stripFirstHeading: true });
    document.title = `${doc.title} - SwMacroFlow docs`;
    renderNav();
  }

  function showFailure() {
    nav.innerHTML = `<p class="docs-nav-status">Guides unavailable.</p>`;
    titleEl.textContent = "Documentation unavailable";
    bodyEl.innerHTML =
      `<p>The guides could not be loaded. Reload the page, and if it keeps failing please contact ` +
      `<a href="mailto:info@swmacroflow.in">info@swmacroflow.in</a>.</p>` +
      `<p>The same documentation ships inside the application: open SwMacroFlow and click ` +
      `<strong>Help</strong>.</p>`;
  }

  function selectedSlug() {
    const slug = decodeURIComponent(window.location.hash.replace(/^#/, ""));
    return state.docs.has(slug) ? slug : "";
  }

  async function loadDocs() {
    let manifest;
    try {
      manifest = JSON.parse(await fetchText(`${DOCS_PATH}/manifest.json`));
    } catch (error) {
      showFailure();
      return;
    }

    const groups = Array.isArray(manifest.groups) ? manifest.groups : [];
    const slugs = groups.reduce((all, group) => all.concat(group.docs || []), []);

    // Every guide is fetched upfront: they are small static files, switching between them is then
    // instant, and the search box can look inside bodies as well as titles.
    await Promise.all(slugs.map(async slug => {
      try {
        const markdown = await fetchText(`${DOCS_PATH}/${slug}.md`);
        const title = SwMarkdown.firstHeading(markdown) || titleFromSlug(slug);
        state.docs.set(slug, { title, markdown, search: `${title}\n${markdown}`.toLowerCase() });
      } catch (error) {
        // A guide that will not load is dropped from the list rather than shown broken.
      }
    }));

    // Drop guides that failed, then groups left with nothing in them.
    state.groups = groups
      .map(group => ({ title: group.title, docs: (group.docs || []).filter(slug => state.docs.has(slug)) }))
      .filter(group => group.docs.length);

    if (!state.groups.length) {
      showFailure();
      return;
    }

    showDoc(selectedSlug() || state.groups[0].docs[0]);
  }

  window.addEventListener("hashchange", () => {
    const slug = selectedSlug();
    if (slug && slug !== state.current) showDoc(slug);
  });

  search.addEventListener("input", renderNav);

  loadDocs();
</script>
