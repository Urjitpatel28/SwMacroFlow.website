<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Signing in to SwMacroFlow</title>
<!--
  Styled inline rather than from assets/site.css, which is the one place on this site where
  duplicating a palette is the right call. See the note below: this page deliberately fetches
  nothing it does not need, and a stylesheet is a fetch. The colours are copied from site.css and
  will not drift in any way a visitor would notice, because the page is on screen for a few hundred
  milliseconds before it redirects.
-->
<style>
  :root { --bg: #0b0d12; --panel-border: #262c3a; --text: #eef1f7; --text-dim: #a3acc2; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f7f7fa; --panel-border: #e4e6ee; --text: #16181f; --text-dim: #4b5266; }
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { text-align: center; max-width: 30rem; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0; color: var(--text-dim); font-size: 14px; }
</style>
</head>
<body>
<!--
  The desktop app's sign-in bounce, and nothing else.

  SwMacroFlow signs in with Google and Microsoft the way a native application is supposed to:
  authorization code + PKCE in the real browser, redirected back to a loopback socket the app is
  listening on. The port is whatever the OS handed out, so no fixed entry in Supabase's redirect
  allow-list could ever match it. This page is the one static allow-listed URL in the middle: it
  takes the code and forwards it to the port carried in `state`.

  That makes this page a redirector, and a redirector that will send a browser anywhere is an open
  redirect. So the only destination it will ever produce is http://127.0.0.1:<port>/ with a port
  parsed as an integer in 1024-65535 and rebuilt from scratch - never a URL taken from the query
  string. Everything else on the page is refusal.

  Deliberately no dependencies. This page handles an authorization code; it does not need a
  framework, and every script it does not load is one that cannot be compromised into reading one.
-->
<main>
  <h1 id="heading">Finishing sign-in…</h1>
  <p id="detail">Returning you to SwMacroFlow.</p>
</main>

<script>
(function () {
  "use strict";

  var heading = document.getElementById("heading");
  var detail = document.getElementById("detail");

  function fail(message) {
    heading.textContent = "Could not finish signing in";
    detail.textContent = message;
  }

  var params = new URLSearchParams(window.location.search);

  // Supabase reports a refusal in the query string rather than by failing the redirect.
  var oauthError = params.get("error_description") || params.get("error");

  var state = params.get("state") || "";
  var code = params.get("code") || "";

  // state is "<port>.<nonce>". The nonce is checked by the app, not here - this page has no way to
  // know it and no business knowing it. All that matters here is the port.
  var separator = state.lastIndexOf(".");
  if (separator < 1) {
    fail("This link is missing information SwMacroFlow needs. Start sign-in again from the app.");
    return;
  }

  var portText = state.slice(0, separator);
  var nonce = state.slice(separator + 1);

  // Strict: digits only. Not parseInt, which would happily accept "8080junk" and "0x1f80".
  if (!/^[0-9]{4,5}$/.test(portText) || !/^[0-9a-f]{8,64}$/.test(nonce)) {
    fail("This link does not look like it came from SwMacroFlow.");
    return;
  }

  var port = Number(portText);
  if (port < 1024 || port > 65535) {
    fail("This link does not look like it came from SwMacroFlow.");
    return;
  }

  // Built from validated pieces. Nothing from the query string reaches the destination except the
  // code and the state, both as encoded query parameters on a host this page chose.
  var target = "http://127.0.0.1:" + port + "/?"
    + (oauthError
        ? "error=" + encodeURIComponent(oauthError)
        : "code=" + encodeURIComponent(code))
    + "&state=" + encodeURIComponent(state);

  if (!oauthError && !code) {
    fail("No sign-in code came back. Start sign-in again from the app.");
    return;
  }

  heading.textContent = "Signed in";
  detail.textContent = "You can close this tab and return to SwMacroFlow.";

  // replace() rather than assign(), so the code does not sit in the back-stack of a shared browser.
  window.location.replace(target);
})();
</script>
</body>
</html>
